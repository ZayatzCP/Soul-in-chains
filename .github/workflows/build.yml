name: Build

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mod jar
        run: ./gradlew build --stacktrace --no-daemon
      - name: Run game tests (headless server with Ars Nouveau + Curios)
        run: |
          set -o pipefail
          ./gradlew runGameTestServer --stacktrace --no-daemon 2>&1 | tee gametest-output.log
          # The game test server can crash on start and still exit with 0: insist on the success line.
          grep -q "required tests passed" gametest-output.log
      - name: Upload game test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-logs
          path: runs/gametest/logs/
          if-no-files-found: ignore
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: arcane_artifacts-jar
          # Only the mod itself: the -sources.jar must not end up in a mods folder.
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
