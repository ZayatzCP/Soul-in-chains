plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.91'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_version
    }

    runs {
        client {
            client()
            gameDirectory = project.file('runs/client')
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('runs/server')
        }
        // Starts a headless server, runs every @GameTest of this mod and exits (non-zero on failure).
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('runs/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenCentral()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup('software.bernie.geckolib') }
    }
    maven {
        name = 'Illusive Soulworks maven (Curios)'
        url = 'https://maven.theillusivec4.top/'
    }
    maven {
        name = "Jared's maven (Ars Nouveau)"
        url = 'https://maven.blamejared.com/'
    }
}

dependencies {
    // Ars Nouveau: compiled against, required at runtime (declared in neoforge.mods.toml)
    implementation("com.hollingsworth.ars_nouveau:ars_nouveau-${minecraft_version}:${ars_version}") { transitive = false }
    // Ars Nouveau's own hard dependencies, needed on the compile classpath because
    // EntityProjectileSpell implements GeoEntity and curio items implement ICurioItem.
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    implementation "com.hollingsworth.nuggets:nuggets-neoforge-1.21.1:${nuggets_version}"
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            ars_version_range      : ars_version_range,
            curios_version_range   : curios_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
